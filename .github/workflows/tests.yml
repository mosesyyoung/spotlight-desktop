name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Compile source
        run: python -m py_compile spotlight_downloader.py

      - name: Check GNOME extension JavaScript
        run: node --check gnome-extension/spotlight-desktop@mosesyyoung/extension.js

      - name: Check installer shell syntax
        run: sh -n scripts/install-gnome-extension.sh

      - name: Run tests
        run: python -m unittest discover -s tests -v
